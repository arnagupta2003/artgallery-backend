version: "3.8"

services:
  # The Node.js Vendure Backend Application Engine
  backend:
    image: artgallery/backend:1438
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      # Maps your local media folder directly into the container's app path
      - /home/arnav/prod-data/debangshu-art/debangshu-vendure-assets:/usr/src/app/assets
    environment:
      - DB_TYPE=postgres
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_NAME=vendure
      - DB_USER=vendure
      - DB_PASSWORD=Shk2UoNGm5jA2ZcejznNeg
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - dokploy-network

  # The Relational Postgres Database
  postgres_db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "6543:5432"
    volumes:
      # Maps your existing database files right back into the engine data path
      - /home/arnav/prod-data/debangshu-art/debangshu-vendure-db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=vendure
      - POSTGRES_USER=vendure
      - POSTGRES_PASSWORD=Shk2UoNGm5jA2ZcejznNeg

  # The Job Queue & Cache Engine
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6479:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
    driver: local
